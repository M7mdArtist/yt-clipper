<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Clipper</title>

    <!-- Loading the slider library from your local npm node_modules -->
    <link href="/npm/nouislider/dist/nouislider.min.css" rel="stylesheet" />
    <script src="/npm/nouislider/dist/nouislider.min.js"></script>

    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #121212;
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }
      .container {
        background: #1e1e1e;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        width: 100%;
        max-width: 600px;
        text-align: center;
        position: relative;
      }
      h2 {
        margin-top: 0;
        color: #f1f1f1;
      }

      input,
      select {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 6px;
        border: 1px solid #333;
        background: #2a2a2a;
        color: #fff;
        box-sizing: border-box;
        font-size: 15px;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: #e50914;
      }

      .time-inputs {
        display: flex;
        gap: 12px;
      }
      .time-inputs input {
        background: #222;
        text-align: center;
        font-family: monospace;
        font-size: 16px;
        letter-spacing: 1px;
        transition: border 0.3s;
      }

      button {
        width: 100%;
        padding: 14px;
        margin-top: 15px;
        border-radius: 6px;
        border: none;
        background: #e50914;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition:
          background 0.3s,
          opacity 0.3s;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }
      button:hover:not(:disabled) {
        background: #b20710;
      }
      button:disabled {
        background: #444;
        color: #888;
        cursor: not-allowed;
      }

      .spinner {
        display: none;
        width: 18px;
        height: 18px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 1s ease-in-out infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #video-container {
        margin-top: 15px;
        border-radius: 8px;
        overflow: hidden;
        background: #000;
      }
      #slider {
        margin: 35px 15px 25px 15px;
        display: none;
      }

      .noUi-target {
        background: #333;
        border: none;
        box-shadow: none;
        height: 8px;
      }
      .noUi-connect {
        background: #e50914;
      }
      .noUi-handle {
        border: none;
        background: #fff;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        border-radius: 50%;
        width: 20px !important;
        height: 20px !important;
        right: -10px !important;
        top: -6px !important;
        cursor: grab;
      }
      .noUi-handle:active {
        cursor: grabbing;
        transform: scale(1.1);
      }
      .noUi-handle:before,
      .noUi-handle:after {
        display: none;
      }

      #status {
        margin-top: 15px;
        font-size: 14px;
        font-weight: 500;
        min-height: 20px;
      }

      .ai-note {
        margin-top: 25px;
        font-size: 12px;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-top: 1px solid #333;
        padding-top: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>YouTube Clipper ✂️</h2>
      <input type="text" id="url" placeholder="Paste YouTube URL here..." oninput="handleUrlChange()" />

      <div id="video-container">
        <div id="player"></div>
      </div>

      <div id="slider"></div>

      <div class="time-inputs">
        <input type="text" id="start" placeholder="Start (00:00:00)" />
        <input type="text" id="end" placeholder="End (00:00:00)" />
      </div>

      <select id="format">
        <option value="mp4">Video (MP4)</option>
        <option value="mp3">Audio Only (MP3)</option>
      </select>

      <button id="downloadBtn" onclick="downloadVideo()" disabled>
        <span class="spinner" id="btnSpinner"></span>
        <span id="btnText">Cut & Download</span>
      </button>
      <p id="status"></p>

      <div class="ai-note">⚠️ This tool was crafted by Artificial Intelligence.</div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
      let player;
      let sliderInit = false;

      function extractVideoID(url) {
        const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
        const match = url.match(regex);
        return match ? match[1] : null;
      }

      function formatTime(seconds) {
        const h = Math.floor(seconds / 3600)
          .toString()
          .padStart(2, '0');
        const m = Math.floor((seconds % 3600) / 60)
          .toString()
          .padStart(2, '0');
        const s = Math.floor(seconds % 60)
          .toString()
          .padStart(2, '0');
        return `${h}:${m}:${s}`;
      }

      function timeToSeconds(timeStr) {
        const parts = timeStr.split(':').map(Number);
        if (parts.length === 3) {
          return parts[0] * 3600 + parts[1] * 60 + parts[2];
        } else if (parts.length === 2) {
          return parts[0] * 60 + parts[1];
        }
        return Number(timeStr) || 0;
      }

      function handleUrlChange() {
        const url = document.getElementById('url').value;
        const vidId = extractVideoID(url);

        if (vidId) {
          if (!player) {
            player = new YT.Player('player', {
              height: '315',
              width: '100%',
              videoId: vidId,
              playerVars: { rel: 0 },
              events: { onReady: () => checkDuration() },
            });
          } else {
            player.loadVideoById(vidId);
            checkDuration();
          }
        }
      }

      function checkDuration() {
        const duration = player.getDuration();
        if (duration > 0) {
          setupSlider(duration);
          document.getElementById('downloadBtn').disabled = false;
        } else {
          setTimeout(checkDuration, 500);
        }
      }

      function setupSlider(duration) {
        const slider = document.getElementById('slider');
        slider.style.display = 'block';

        if (sliderInit) {
          slider.noUiSlider.updateOptions({ range: { min: 0, max: duration } });
          slider.noUiSlider.set([0, duration]);
        } else {
          noUiSlider.create(slider, {
            start: [0, duration],
            connect: true,
            step: 1,
            range: { min: 0, max: duration },
          });

          sliderInit = true;
        }

        // Explicitly set default values to the beginning and end of the video immediately
        document.getElementById('start').value = formatTime(0);
        document.getElementById('end').value = formatTime(duration);

        // Update inputs when sliding
        slider.noUiSlider.on('update', function (values) {
          if (document.activeElement.id !== 'start') {
            document.getElementById('start').value = formatTime(values[0]);
          }
          if (document.activeElement.id !== 'end') {
            document.getElementById('end').value = formatTime(values[1]);
          }
        });

        // Seek video when slider is released
        slider.noUiSlider.on('change', function (values, handle) {
          player.seekTo(values[handle]);
        });
      }

      document.getElementById('start').addEventListener('change', function (e) {
        if (sliderInit) {
          const secs = timeToSeconds(e.target.value);
          slider.noUiSlider.set([secs, null]);
          player.seekTo(secs);
        }
      });

      document.getElementById('end').addEventListener('change', function (e) {
        if (sliderInit) {
          const secs = timeToSeconds(e.target.value);
          slider.noUiSlider.set([null, secs]);
          player.seekTo(secs);
        }
      });

      async function downloadVideo() {
        const url = document.getElementById('url').value;
        const start = document.getElementById('start').value;
        const end = document.getElementById('end').value;
        const format = document.getElementById('format').value;

        const btn = document.getElementById('downloadBtn');
        const status = document.getElementById('status');
        const spinner = document.getElementById('btnSpinner');
        const btnText = document.getElementById('btnText');

        btn.disabled = true;
        spinner.style.display = 'block';
        btnText.innerText = 'Processing...';

        status.style.color = '#aaa';
        status.innerText = 'Clipping and encoding on server. Please wait...';

        try {
          const response = await fetch('/download', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url, start, end, format }),
          });

          if (response.ok) {
            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;

            a.download = `youtube_clip.${format}`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(downloadUrl);

            status.innerText = '✅ Downloaded successfully!';
            status.style.color = '#4caf50';
          } else {
            const errData = await response.json();
            status.innerText = `❌ ${errData.error || 'Error occurred during processing.'}`;
            status.style.color = '#ff4a4a';
          }
        } catch (error) {
          status.innerText = '❌ Failed to connect to server. Is it running?';
          status.style.color = '#ff4a4a';
        } finally {
          btn.disabled = false;
          spinner.style.display = 'none';
          btnText.innerText = 'Cut & Download';
        }
      }
    </script>
  </body>
</html>
