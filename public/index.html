<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Clipper</title>

    <link href="/npm/nouislider/dist/nouislider.min.css" rel="stylesheet" />
    <script src="/npm/nouislider/dist/nouislider.min.js"></script>

    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #121212;
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }
      .container {
        background: #1e1e1e;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        width: 100%;
        max-width: 600px;
        text-align: center;
        position: relative;
      }
      h2 {
        margin-top: 0;
        color: #f1f1f1;
      }

      input,
      select {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 6px;
        border: 1px solid #333;
        background: #2a2a2a;
        color: #fff;
        box-sizing: border-box;
        font-size: 15px;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: #e50914;
      }

      .row {
        display: flex;
        gap: 10px;
      }
      .row > * {
        flex: 1;
      }

      .time-inputs {
        display: flex;
        gap: 12px;
      }
      .time-inputs input {
        background: #222;
        text-align: center;
        font-family: monospace;
        font-size: 16px;
        letter-spacing: 1px;
      }

      button {
        width: 100%;
        padding: 14px;
        margin-top: 15px;
        border-radius: 6px;
        border: none;
        background: #e50914;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }
      button:hover:not(:disabled) {
        background: #b20710;
      }
      button:disabled {
        background: #444;
        color: #888;
        cursor: not-allowed;
      }

      #video-container {
        margin-top: 15px;
        border-radius: 8px;
        overflow: hidden;
        background: #000;
      }
      #slider {
        margin: 35px 15px 25px 15px;
        display: none;
      }

      .noUi-target {
        background: #333;
        border: none;
        box-shadow: none;
        height: 8px;
      }
      .noUi-connect {
        background: #e50914;
      }
      .noUi-handle {
        border: none;
        background: #fff;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        border-radius: 50%;
        width: 20px !important;
        height: 20px !important;
        right: -10px !important;
        top: -6px !important;
        cursor: grab;
      }

      /* Live Terminal Logs Box */
      #terminal-logs {
        display: none;
        margin-top: 15px;
        background: #0a0a0a;
        color: #00ff66;
        font-family: monospace;
        font-size: 12px;
        text-align: left;
        padding: 12px;
        border-radius: 6px;
        height: 120px;
        overflow-y: auto;
        border: 1px solid #333;
        white-space: pre-wrap;
        word-break: break-all;
      }

      #status {
        margin-top: 15px;
        font-size: 14px;
        font-weight: 500;
        min-height: 20px;
      }

      .ai-note {
        margin-top: 25px;
        font-size: 12px;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-top: 1px solid #333;
        padding-top: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>YouTube Clipper ✂️</h2>
      <input type="text" id="url" placeholder="Paste YouTube URL here..." oninput="handleUrlChange()" />

      <div id="video-container">
        <div id="player"></div>
      </div>

      <div id="slider"></div>

      <div class="time-inputs">
        <input type="text" id="start" placeholder="Start (00:00:00)" />
        <input type="text" id="end" placeholder="End (00:00:00)" />
      </div>

      <div class="row">
        <select id="format" onchange="toggleQualityOptions()">
          <option value="mp4">Video (MP4)</option>
          <option value="mp3">Audio Only (MP3)</option>
        </select>

        <!-- Quality Selectors -->
        <select id="videoQuality">
          <option value="fast">Best / Fastest (Single Stream)</option>
          <option value="1080">1080p HD</option>
          <option value="720">720p HD</option>
          <option value="480">480p SD</option>
        </select>

        <select id="audioQuality" style="display: none">
          <option value="192k">192 kbps (Standard)</option>
          <option value="320k">320 kbps (High Quality)</option>
          <option value="128k">128 kbps (Fastest)</option>
        </select>
      </div>

      <button id="downloadBtn" onclick="startDownload()" disabled>Cut & Download</button>

      <div id="terminal-logs"></div>
      <p id="status"></p>

      <div class="ai-note">⚠️ This tool was crafted by Artificial Intelligence.</div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
      let player;
      let sliderInit = false;

      function toggleQualityOptions() {
        const format = document.getElementById('format').value;
        const vQ = document.getElementById('videoQuality');
        const aQ = document.getElementById('audioQuality');
        if (format === 'mp3') {
          vQ.style.display = 'none';
          aQ.style.display = 'block';
        } else {
          vQ.style.display = 'block';
          aQ.style.display = 'none';
        }
      }

      function extractVideoID(url) {
        const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
        const match = url.match(regex);
        return match ? match[1] : null;
      }

      function formatTime(seconds) {
        const h = Math.floor(seconds / 3600)
          .toString()
          .padStart(2, '0');
        const m = Math.floor((seconds % 3600) / 60)
          .toString()
          .padStart(2, '0');
        const s = Math.floor(seconds % 60)
          .toString()
          .padStart(2, '0');
        return `${h}:${m}:${s}`;
      }

      function timeToSeconds(timeStr) {
        const parts = timeStr.split(':').map(Number);
        if (parts.length === 3) {
          return parts[0] * 3600 + parts[1] * 60 + parts[2];
        } else if (parts.length === 2) {
          return parts[0] * 60 + parts[1];
        }
        return Number(timeStr) || 0;
      }

      function handleUrlChange() {
        const url = document.getElementById('url').value;
        const vidId = extractVideoID(url);

        if (vidId) {
          if (!player) {
            player = new YT.Player('player', {
              height: '315',
              width: '100%',
              videoId: vidId,
              playerVars: { rel: 0 },
              events: { onReady: () => checkDuration() },
            });
          } else {
            player.loadVideoById(vidId);
            checkDuration();
          }
        }
      }

      function checkDuration() {
        const duration = player.getDuration();
        if (duration > 0) {
          setupSlider(duration);
          document.getElementById('downloadBtn').disabled = false;
        } else {
          setTimeout(checkDuration, 500);
        }
      }

      function setupSlider(duration) {
        const slider = document.getElementById('slider');
        slider.style.display = 'block';

        if (sliderInit) {
          slider.noUiSlider.updateOptions({ range: { min: 0, max: duration } });
          slider.noUiSlider.set([0, duration]);
        } else {
          noUiSlider.create(slider, {
            start: [0, duration],
            connect: true,
            step: 1,
            range: { min: 0, max: duration },
          });
          sliderInit = true;
        }

        document.getElementById('start').value = formatTime(0);
        document.getElementById('end').value = formatTime(duration);

        slider.noUiSlider.on('update', function (values) {
          if (document.activeElement.id !== 'start') {
            document.getElementById('start').value = formatTime(values[0]);
          }
          if (document.activeElement.id !== 'end') {
            document.getElementById('end').value = formatTime(values[1]);
          }
        });

        slider.noUiSlider.on('change', function (values, handle) {
          player.seekTo(values[handle]);
        });
      }

      document.getElementById('start').addEventListener('change', function (e) {
        if (sliderInit) {
          const secs = timeToSeconds(e.target.value);
          slider.noUiSlider.set([secs, null]);
          player.seekTo(secs);
        }
      });

      document.getElementById('end').addEventListener('change', function (e) {
        if (sliderInit) {
          const secs = timeToSeconds(e.target.value);
          slider.noUiSlider.set([null, secs]);
          player.seekTo(secs);
        }
      });

      function startDownload() {
        const url = document.getElementById('url').value;
        const start = document.getElementById('start').value;
        const end = document.getElementById('end').value;
        const format = document.getElementById('format').value;
        const quality =
          format === 'mp3'
            ? document.getElementById('audioQuality').value
            : document.getElementById('videoQuality').value;

        const btn = document.getElementById('downloadBtn');
        const status = document.getElementById('status');
        const terminal = document.getElementById('terminal-logs');

        btn.disabled = true;
        terminal.style.display = 'block';
        terminal.innerText = 'Initializing connection...\n';
        status.style.color = '#aaa';
        status.innerText = 'Processing clip... Check live logs below.';

        const queryParams = new URLSearchParams({ url, start, end, format, quality });
        const eventSource = new EventSource(`/api/clip?${queryParams.toString()}`);

        eventSource.onmessage = function (event) {
          const data = JSON.parse(event.data);

          if (data.log) {
            terminal.innerText += data.log;
            terminal.scrollTop = terminal.scrollHeight; // Auto-scroll to bottom
          }

          if (data.success) {
            eventSource.close();
            status.innerText = '✅ Download complete! Starting file download...';
            status.style.color = '#4caf50';
            btn.disabled = false;

            // Trigger file download automatically
            window.location.href = `/download-file/${data.file}`;
          }

          if (data.error) {
            eventSource.close();
            status.innerText = `❌ ${data.error}`;
            status.style.color = '#ff4a4a';
            btn.disabled = false;
          }
        };

        eventSource.onerror = function () {
          eventSource.close();
          status.innerText = '❌ Connection lost with server.';
          status.style.color = '#ff4a4a';
          btn.disabled = false;
        };
      }
    </script>
  </body>
</html>
